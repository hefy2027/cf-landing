# 每次 push 到 main 自动把 cf-landing 部署为 surge.sh 备用源。
# 与 cf-reg 的 surge.yml 同款部署方式（surge publish --token）。
#
# 需要的仓库 Secrets：
#   SURGE_TOKEN  —— surge 登录后 `surge token` 获取
#
# 部署命令：npx surge publish <目录> --domain <域名> --token <token>
name: Deploy surge.sh backup source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: SPA fallback (200.html)
        run: cp dist/index.html dist/200.html

      - name: Publish to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          SURGE_DOMAIN: cf-manager.surge.sh
        run: npx surge publish dist --domain $SURGE_DOMAIN --token $SURGE_TOKEN

      - name: Verify deployment
        run: |
          sleep 3
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://cf-manager.surge.sh/")
          echo "index → HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "::error::部署失败"; exit 1; }
